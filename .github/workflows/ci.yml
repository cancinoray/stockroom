name: CI

# Pull requests and pushes to main run lint, unit/frontend tests, the OpenAPI
# contract lint and the container build. CI does not deploy: deployment is a
# human-run `docker compose` step on a self-hosted host (P5).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, tests and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Contract drift check
        run: cd frontend && npm run check:contract
      - name: Lint the OpenAPI contract
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml

  docker-build:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the dev image
        run: docker build -t stockroom:ci .
