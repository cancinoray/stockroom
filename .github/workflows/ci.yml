name: CI

# Pull requests run lint, unit tests and the container build. A push to main
# does the same, then deploys the dev environment when FLY_API_TOKEN is
# configured. The deploy job is skipped (green) until a human provisions the
# Fly app and the token; production promotion is T5.3 and lives elsewhere.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, tests and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Lint the OpenAPI contract
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml

  docker-build:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the dev image
        run: docker build -t stockroom:ci .

  # GitHub does not allow `secrets` in a job-level `if`, so this job exposes
  # whether FLY_API_TOKEN exists as an output. deploy-dev gates on that output
  # and stays skipped (green) when the secret is absent.
  deploy-token:
    name: check deploy token
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    name: deploy dev
    needs: [test, docker-build, deploy-token]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-token.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
