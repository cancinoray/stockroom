# Loki for the local stack (T6.2, issue #56).
#
# Single-binary, filesystem-backed, no auth: a throwaway local log store that
# Alloy pushes the app's JSON stdout lines into. Retention is not enabled, so
# the container's data volume is the only bound on how much the local stack
# keeps.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor

analytics:
  reporting_enabled: false
