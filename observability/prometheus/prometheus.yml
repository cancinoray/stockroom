# Prometheus for the local stack (T6.2, issue #56; rules in T6.3, #57).
#
# The only scrape target is the collector's Prometheus exporter. Prometheus
# never scrapes the app: T6.1 gives it no metrics endpoint and metrics travel
# app -> OTLP -> collector -> :8889 -> here.
#
# The alert rules live in `observability/alerts.yaml` and are mounted read-only
# by `compose.observability.yaml`. Prometheus refuses to start when a listed rule
# file is missing, so the mount and this entry move together; `make check-alerts`
# validates the file before the stack is started.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
