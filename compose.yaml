# Local one-command stack for `make dev`: Postgres plus the FastAPI app.
# The credentials below are throwaway local-development values, never secrets.
name: stockroom

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - stockroom-db:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STOCKROOM_DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      STOCKROOM_ENVIRONMENT: development
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && python -m backend.db.seed && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  stockroom-db:
