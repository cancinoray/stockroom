# One container serves the API and the built React app (T5.1, issue #46).
#
# The image reference is a single variable. Its default is the local build, so
# `docker compose up --build` still works untouched; T5.3 (#48) runs a published
# tag with `STOCKROOM_IMAGE=<registry>/stockroom:<tag> docker compose up`.
# The credentials below are throwaway local-development values, never secrets.
name: stockroom

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - stockroom-db:/var/lib/postgresql/data

  app:
    image: ${STOCKROOM_IMAGE:-stockroom-app:local}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STOCKROOM_DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      STOCKROOM_ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  stockroom-db:
