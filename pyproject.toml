[project]
name = "stockroom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "psycopg[binary]",
  "pydantic-settings",
  "sqlalchemy",
  "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
# The project is not an installed package ([tool.uv] package = false), so make the
# repo root importable for `uv run pytest` without needing `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
